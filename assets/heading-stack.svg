<svg width="1000" height="90" viewBox="0 0 1000 90" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fb8"/>
      <stop offset="1" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fb8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="p" fill="#ffb3cf" d="M0,0 C4,-6 9,-3 7,3 C5,7 1,7 0,4 C-1,7 -5,7 -7,3 C-9,-3 -4,-6 0,0Z"/>
    <g id="flower">
      <use xlink:href="#p" transform="rotate(0) translate(0 -2)"/>
      <use xlink:href="#p" transform="rotate(72) translate(0 -2)"/>
      <use xlink:href="#p" transform="rotate(144) translate(0 -2)"/>
      <use xlink:href="#p" transform="rotate(216) translate(0 -2)"/>
      <use xlink:href="#p" transform="rotate(288) translate(0 -2)"/>
      <circle r="2" fill="#fff6b0"/>
    </g>
  </defs>

  <!-- left flower -->
  <g transform="translate(190 38) scale(1.6)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    <use xlink:href="#flower"/>
  </g>

  <!-- right flower -->
  <g transform="translate(810 38) scale(1.6)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    <use xlink:href="#flower"/>
  </g>

  <!-- title -->
  <text x="500" y="48" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#txt)" filter="url(#glow)" opacity="0">
    TECH STACK
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <!-- underline + moving dot -->
  <rect x="330" y="60" width="340" height="2" fill="url(#bar)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cy="61" r="2.5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="330;670;330" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- caption -->
  <text x="500" y="82" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" letter-spacing="5" fill="#ff8fb8" opacity="0.85">
    // what i build with
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
