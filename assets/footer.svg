<svg width="1000" height="170" viewBox="0 0 1000 170" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fb8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff8fb8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fb8"/>
      <stop offset="1" stop-color="#00f5ff"/>
    </linearGradient>
    <path id="petal" fill="#ffb3cf" d="M0,-8 C5,-10 10,-4 8,2 C7,6 3,9 0,6 C-3,9 -7,6 -8,2 C-10,-4 -5,-10 0,-8Z"/>
  </defs>

  <!-- back wave (moves right) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="14s" repeatCount="indefinite"/>
    <path fill="url(#waveB)" d="M0,75 Q125,35 250,75 T500,75 T750,75 T1000,75 T1250,75 T1500,75 T1750,75 T2000,75 V170 H0 Z"/>
  </g>

  <!-- front wave (moves left) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="9s" repeatCount="indefinite"/>
    <path fill="url(#waveA)" d="M0,95 Q125,55 250,95 T500,95 T750,95 T1000,95 T1250,95 T1500,95 T1750,95 T2000,95 V170 H0 Z"/>
  </g>

  <!-- text -->
  <text x="500" y="112" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="url(#txt)">
    THANKS FOR STOPPING BY
  </text>
  <text x="500" y="140" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" letter-spacing="4" fill="#ffd1e3" opacity="0.85">
    see you in the next commit
  </text>

  <!-- floating petals -->
  <g>
    <g><animateTransform attributeName="transform" type="translate" from="120 -10" to="170 180" dur="9s" begin="-2s" repeatCount="indefinite"/>
      <g transform="scale(1)"><use xlink:href="#petal" opacity="0.8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></use></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="360 -10" to="320 180" dur="11s" begin="-6s" repeatCount="indefinite"/>
      <g transform="scale(0.8)"><use xlink:href="#petal" opacity="0.7"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/></use></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="640 -10" to="690 180" dur="10s" begin="-4s" repeatCount="indefinite"/>
      <g transform="scale(1.2)"><use xlink:href="#petal" opacity="0.75"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/></use></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="880 -10" to="840 180" dur="12s" begin="-9s" repeatCount="indefinite"/>
      <g transform="scale(0.9)"><use xlink:href="#petal" opacity="0.8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/></use></g></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
