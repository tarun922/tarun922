<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fb8"/>
      <stop offset="1" stop-color="#00f5ff"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="998" height="228" rx="18" fill="#0d0d14" stroke="#ff8fb8" stroke-opacity="0.3"/>

  <text x="500" y="38" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="14" letter-spacing="8" fill="#ff8fb8">CURRENTLY ON</text>

  <!-- track -->
  <line x1="100" y1="105" x2="900" y2="105" stroke="url(#track)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- travelling dot -->
  <circle cy="105" r="5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="100;900;100" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- node 1 -->
  <circle cx="100" cy="105" r="10" fill="none" stroke="#ff8fb8" stroke-width="2">
    <animate attributeName="r" values="10;24" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="105" r="10" fill="#ff8fb8" filter="url(#glow)"/>
  <text x="100" y="80" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#ff8fb8">01</text>
  <text x="100" y="146" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Seeky</text>
  <text x="100" y="168" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#b9b9c9">+ Seeky.Anim</text>

  <!-- node 2 -->
  <circle cx="300" cy="105" r="10" fill="none" stroke="#e08fd6" stroke-width="2">
    <animate attributeName="r" values="10;24" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="105" r="10" fill="#e08fd6" filter="url(#glow)"/>
  <text x="300" y="80" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#e08fd6">02</text>
  <text x="300" y="146" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Buddy.live</text>
  <text x="300" y="168" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#b9b9c9">getting it out there</text>

  <!-- node 3 -->
  <circle cx="500" cy="105" r="10" fill="none" stroke="#a99ae8" stroke-width="2">
    <animate attributeName="r" values="10;24" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="105" r="10" fill="#a99ae8" filter="url(#glow)"/>
  <text x="500" y="80" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#a99ae8">03</text>
  <text x="500" y="146" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI Chat App</text>
  <text x="500" y="168" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#b9b9c9">bring your own key</text>

  <!-- node 4 -->
  <circle cx="700" cy="105" r="10" fill="none" stroke="#55c6f0" stroke-width="2">
    <animate attributeName="r" values="10;24" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="105" r="10" fill="#55c6f0" filter="url(#glow)"/>
  <text x="700" y="80" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#55c6f0">04</text>
  <text x="700" y="146" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Anime Compositor</text>
  <text x="700" y="168" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#b9b9c9">one-click looks</text>

  <!-- node 5 -->
  <circle cx="900" cy="105" r="10" fill="none" stroke="#00f5ff" stroke-width="2">
    <animate attributeName="r" values="10;24" dur="2.5s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.5s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="105" r="10" fill="#00f5ff" filter="url(#glow)"/>
  <text x="900" y="80" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#00f5ff">05</text>
  <text x="900" y="146" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Open Source</text>
  <text x="900" y="168" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#b9b9c9">more of it</text>

  <text x="500" y="208" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" letter-spacing="4" fill="#6f6f85">ship * learn * repeat</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
