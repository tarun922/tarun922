<svg width="1000" height="30" viewBox="0 0 1000 30" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fb8" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8fb8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="p" fill="#ffb3cf" d="M0,0 C4,-6 9,-3 7,3 C5,7 1,7 0,4 C-1,7 -5,7 -7,3 C-9,-3 -4,-6 0,0Z"/>
  </defs>

  <!-- lines -->
  <rect x="60" y="14" width="400" height="2" fill="url(#left)"/>
  <rect x="540" y="14" width="400" height="2" fill="url(#right)"/>

  <!-- moving glow dot -->
  <circle cy="15" r="3" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="60;940;60" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- sakura flower -->
  <g transform="translate(500 15)">
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    <g filter="url(#glow)">
      <use xlink:href="#p" transform="rotate(0) translate(0 -2)"/>
      <use xlink:href="#p" transform="rotate(72) translate(0 -2)"/>
      <use xlink:href="#p" transform="rotate(144) translate(0 -2)"/>
      <use xlink:href="#p" transform="rotate(216) translate(0 -2)"/>
      <use xlink:href="#p" transform="rotate(288) translate(0 -2)"/>
      <circle r="2" fill="#fff6b0"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
